steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'me-west1-docker.pkg.dev/$PROJECT_ID/recipe-book/recipe-book:$BUILD_ID'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'me-west1-docker.pkg.dev/$PROJECT_ID/recipe-book/recipe-book:$BUILD_ID'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'recipe-book'
      - '--image'
      - 'me-west1-docker.pkg.dev/$PROJECT_ID/recipe-book/recipe-book:$BUILD_ID'
      - '--region'
      - 'me-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'
      - '--set-env-vars'
      - 'ENV_MODE=production,AUTH_MODE=jwt,GCS_BUCKET_NAME=family-recipe-book-489413-recipe-images,JWT_SECRET=${_JWT_SECRET},ADMIN_USERNAME=${_ADMIN_USERNAME},ADMIN_PASSWORD=${_ADMIN_PASSWORD}'

substitutions:
  _JWT_SECRET: 'change-this-to-a-secure-secret'
  _ADMIN_USERNAME: 'admin'
  _ADMIN_PASSWORD: 'change-this-to-a-secure-password'

images:
  - 'me-west1-docker.pkg.dev/$PROJECT_ID/recipe-book/recipe-book:$BUILD_ID'
